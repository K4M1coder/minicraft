<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MiniCraft — banc de test</title>
<!-- les styles du jeu sont partagés : sans eux, l'interface testée ne serait
     pas celle qui tourne réellement (le viseur ne serait même pas positionné) -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../src/ui.css">
<link rel="stylesheet" href="banc.css">
</head>
<body>

<div id="banc">
  <header id="entete">
    <h1>MiniCraft — banc de test</h1>
    <button id="btn-menu" class="primary">Sélection ▾</button>
    <a id="lien-cahiers" href="/tests/cahiers" target="_blank">Cahiers</a>
    <label class="seuil">Seuil lent (s) <input id="seuil-lent" type="number" value="8" min="1" step="1"></label>

    <div id="panneau-selection" hidden>
      <div class="sel-ligne">
        <input id="recherche" placeholder="rechercher un test ou sa fiche…">
        <select id="presets"><option value="">— préréglage —</option></select>
      </div>
      <div id="arbre" class="arbre"></div>
      <div class="sel-bar">
        <span id="compteur">0 test(s) retenu(s)</span>
        <button id="btn-tout">Tout</button>
        <button id="btn-echecs">Relancer les échecs</button>
        <button id="btn-arreter" disabled>Arrêter</button>
        <button id="btn-lancer" class="primary">Lancer</button>
      </div>
    </div>
  </header>

  <main id="corps">
    <section id="colonne-gauche">
      <ul id="liste-tests" aria-label="tests effectués"></ul>
      <div id="resume" class="resume"></div>
    </section>
    <section id="colonne-droite">
      <div id="quart-haut">
        <div id="lents" class="panneau"><h3>Tests lents</h3><ul class="items"></ul></div>
        <div id="erreurs" class="panneau"><h3>Tests en erreur</h3><ul class="items"></ul></div>
      </div>
      <div id="quart-bas">
        <!-- surface virtuelle : résolution fixe et réaliste (par défaut
             1280×800), mise à l'échelle par transform CSS pour tenir dans le
             quart — le jeu ne se croit donc jamais dans une minuscule
             fenêtre (SPEC-BANC-008/017). -->
        <div id="surface-virtuelle"><div id="host"></div></div>
        <div id="panneau-debug" class="debug"></div>
      </div>
      <div id="surface-agrandie" hidden></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Meme jeton anti-cache que le jeu : sans lui, la page de tests peut charger
   un melange de versions et produire des echecs inexplicables. */
var v = Date.now();
function balise(f) { return '<scr' + 'ipt src="' + f + '?v=' + v + '"></scr' + 'ipt>'; }
// harness.js d'abord (il pose G.T), puis presets.js et catalogue.js (dans cet
// ordre : catalogue.js relit G.MC_PRESETS), puis rapport.js (repli local du
// cahier de test si le serveur ne répond pas) — même ordre que tests/run.js.
document.write(['harness.js', 'presets.js', 'catalogue.js', 'rapport.js'].map(balise).join(''));
</script>
<script>
document.write(['../src/core.js', '../src/formes.js', '../src/noise.js', '../src/biomes.js', '../src/densite.js', '../src/zones.js', '../src/volcanisme.js', '../src/caravanes.js', '../src/souterrain.js', '../src/recifs.js', '../src/donjons.js', '../src/habitats.js', '../src/routes.js', '../src/histoire.js', '../src/recits.js', '../src/carte.js', '../src/eau.js', '../src/feu.js', '../src/meteo.js', '../src/lointain.js', '../src/world.js', '../src/circuits.js', '../src/lumiere.js', '../src/ombres.js', '../src/succes.js', '../src/mesher.js', '../src/physics.js', '../src/file-chunks.js', '../src/taches-chunks.js', '../src/faune.js', '../src/factions.js', '../src/inventory.js', '../src/conteneurs.js', '../src/vehicules.js', '../src/entities.js', '../src/metiers.js', '../src/economie.js',

  '../src/player.js', '../src/synchro.js', '../src/daycycle.js', '../src/save.js', '../src/saves.js',
  '../src/modes.js', '../src/chat.js', '../src/commandes.js', '../src/options.js', '../src/apparence.js', '../src/split.js', '../src/hud.js', '../src/gamepad.js', '../src/contrats-vague2.js', '../src/net-protocol.js', '../src/parametres.js', '../src/admin.js', '../src/politique.js', '../src/guildes.js', '../src/pvp-enjeux.js', '../src/livre.js', '../src/livres.js', '../src/net.js', '../src/ambiance.js', '../src/audio.js', '../src/qualite.js', '../src/atlas.js', '../src/workers.js',
  '../src/render.js', '../src/ui.js', '../src/input.js', '../src/game.js', '../src/debug.js']
  .map(balise).join(''));
</script>
<script>
/* Fichiers de tests Node purs (unit/functional/spec-*) — même liste et même
   ordre que la constante TESTS de tests/run.js (hors spec-banc.js, Node-only :
   il utilise require/process/__dirname, voir son en-tête ; les trois derniers,
   'spec-perf'/'limites-sondes'/'spec-limites', sont l'exploration de limites
   du lot perf — voir tests/run.js — purs eux aussi, donc inclus ici pour que
   le banc navigateur voie le même catalogue que `node tests/run.js`).
   `T.fichierCourant` est posé avant chacun, comme le fait tests/run.js côté
   ligne de commande : c'est ce dont tests/catalogue.js a besoin pour déduire
   le type d'un test de son fichier d'origine (SPEC-BANC-001). */
var fichiersTests = ['unit', 'functional', 'spec-modes', 'spec-saves', 'spec-audit', 'spec-armes', 'spec-chat', 'spec-split', 'spec-net', 'spec-secu', 'spec-ia-coll', 'spec-livre', 'spec-monde', 'spec-mer', 'spec-vehicules', 'spec-horizon', 'spec-climat', 'spec-habitats', 'spec-routes', 'spec-histoire', 'spec-succes', 'spec-ombres', 'spec-population', 'spec-hud', 'spec-couverture', 'spec-recits', 'spec-commandes', 'spec-portes', 'spec-eau', 'spec-vent', 'spec-loin', 'spec-donjons', 'spec-audio', 'spec-options', 'spec-souterrain', 'spec-apparence', 'spec-saisons', 'spec-parametres', 'spec-admin', 'spec-densite', 'spec-volcans', 'spec-caravanes', 'spec-zones', 'spec-blocs16', 'spec-politique', 'spec-guildes', 'spec-materiaux', 'spec-circuits', 'spec-objets', 'spec-formes', 'spec-recifs', 'spec-interieur', 'spec-batiments',
  // exploration (lot perf) : sondes non bloquantes — voir tests/run.js
  'spec-perf', 'limites-sondes', 'spec-limites', 'spec-rendu', 'spec-maillage',
  // vague 2
  'spec-contrats-vague2', 'spec-workers', 'spec-economie', 'spec-metiers', 'spec-conteneurs', 'spec-pvp',
  // SPEC-BANC-010 : crochets git, hors spec-banc.js
  'spec-crochets'];

document.write(fichiersTests.map(function (f) {
  return '<scr' + 'ipt>T.fichierCourant="tests/' + f + '.js";</scr' + 'ipt>' + balise(f + '.js');
}).join('') + '<scr' + 'ipt>T.fichierCourant=null;</scr' + 'ipt>');
</script>
<script>
document.write(['e2e.js', 'banc-ui.js'].map(balise).join(''));
</script>
</body>
</html>
