<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MiniCraft — banc de test</title>
<!-- les styles du jeu sont partagés : sans eux, l'interface testée ne serait
     pas celle qui tourne réellement (le viseur ne serait même pas positionné) -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../src/ui.css">
<link rel="stylesheet" href="banc.css">
</head>
<body>

<div id="banc">
  <header id="entete">
    <h1>MiniCraft — banc de test</h1>
    <button id="btn-menu" class="primary">Sélection ▾</button>
    <a id="lien-cahiers" href="/tests/cahiers" target="_blank">Cahiers</a>
    <label class="seuil">Seuil lent (s) <input id="seuil-lent" type="number" value="8" min="1" step="1"></label>

    <div id="panneau-selection" hidden>
      <div class="sel-ligne">
        <input id="recherche" placeholder="rechercher un test ou sa fiche…">
        <select id="presets"><option value="">— préréglage —</option></select>
      </div>
      <div id="arbre" class="arbre"></div>
      <div class="sel-bar">
        <span id="compteur">0 test(s) retenu(s)</span>
        <button id="btn-tout">Tout</button>
        <button id="btn-echecs">Relancer les échecs</button>
        <button id="btn-arreter" disabled>Arrêter</button>
        <button id="btn-lancer" class="primary">Lancer</button>
      </div>
    </div>
  </header>

  <main id="corps">
    <section id="colonne-gauche">
      <ul id="liste-tests" aria-label="tests effectués"></ul>
      <div id="resume" class="resume"></div>
    </section>
    <section id="colonne-droite">
      <div id="quart-haut">
        <div id="lents" class="panneau"><h3>Tests lents</h3><ul class="items"></ul></div>
        <div id="erreurs" class="panneau"><h3>Tests en erreur</h3><ul class="items"></ul></div>
      </div>
      <div id="quart-bas">
        <!-- surface virtuelle : résolution fixe et réaliste (par défaut
             1280×800), mise à l'échelle par transform CSS pour tenir dans le
             quart — le jeu ne se croit donc jamais dans une minuscule
             fenêtre (SPEC-BANC-008/017). -->
        <div id="surface-virtuelle"><div id="host"></div></div>
        <div id="panneau-debug" class="debug"></div>
      </div>
      <div id="surface-agrandie" hidden></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Meme jeton anti-cache que le jeu : sans lui, la page de tests peut charger
   un melange de versions et produire des echecs inexplicables. */
document.write(['harness.js', '../src/core.js', '../src/formes.js', '../src/noise.js', '../src/biomes.js', '../src/densite.js', '../src/zones.js', '../src/volcanisme.js', '../src/caravanes.js', '../src/souterrain.js', '../src/recifs.js', '../src/donjons.js', '../src/habitats.js', '../src/routes.js', '../src/histoire.js', '../src/recits.js', '../src/carte.js', '../src/eau.js', '../src/feu.js', '../src/meteo.js', '../src/lointain.js', '../src/world.js', '../src/circuits.js', '../src/lumiere.js', '../src/ombres.js', '../src/succes.js',
  '../src/mesher.js', '../src/physics.js', '../src/faune.js', '../src/factions.js', '../src/inventory.js', '../src/vehicules.js', '../src/entities.js',
  '../src/player.js', '../src/synchro.js', '../src/daycycle.js', '../src/save.js', '../src/saves.js',
  '../src/modes.js', '../src/chat.js', '../src/commandes.js', '../src/options.js', '../src/apparence.js', '../src/split.js', '../src/hud.js', '../src/gamepad.js', '../src/net-protocol.js', '../src/parametres.js', '../src/admin.js', '../src/politique.js', '../src/guildes.js', '../src/livre.js', '../src/livres.js', '../src/net.js', '../src/ambiance.js', '../src/audio.js', '../src/atlas.js',
  '../src/render.js', '../src/ui.js', '../src/input.js', '../src/game.js', '../src/debug.js',
  'unit.js', 'functional.js', 'spec-modes.js', 'spec-saves.js', 'spec-audit.js', 'spec-armes.js', 'spec-chat.js', 'spec-split.js', 'spec-net.js', 'spec-ia-coll.js', 'spec-livre.js', 'spec-monde.js', 'spec-mer.js', 'spec-vehicules.js', 'spec-horizon.js', 'spec-climat.js', 'spec-habitats.js', 'spec-routes.js', 'spec-histoire.js', 'spec-succes.js', 'spec-ombres.js', 'spec-population.js', 'spec-hud.js', 'spec-couverture.js', 'spec-recits.js', 'spec-commandes.js', 'spec-portes.js', 'spec-eau.js', 'spec-vent.js', 'spec-loin.js', 'spec-donjons.js', 'spec-audio.js', 'spec-options.js', 'spec-souterrain.js', 'spec-apparence.js', 'spec-saisons.js', 'spec-parametres.js', 'spec-admin.js', 'spec-densite.js', 'spec-volcans.js', 'spec-caravanes.js', 'spec-zones.js', 'spec-blocs16.js', 'spec-politique.js', 'spec-guildes.js', 'spec-materiaux.js', 'spec-circuits.js', 'spec-objets.js', 'spec-formes.js', 'spec-recifs.js', 'spec-interieur.js', 'spec-batiments.js', 'e2e.js', 'banc-ui.js']
  .map(function (f) { return '<scr' + 'ipt src="' + f + '?v=' + Date.now() + '"></scr' + 'ipt>'; })
  .join(''));
</script>
</body>
</html>
