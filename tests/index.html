<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MiniCraft — banc de test</title>
<!-- les styles du jeu sont partagés : sans eux, l'interface testée ne serait
     pas celle qui tourne réellement (le viseur ne serait même pas positionné) -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../src/ui.css">
<link rel="stylesheet" href="banc.css">
<link rel="stylesheet" href="historique.css">
</head>
<body>

<div id="banc">
  <header id="entete">
    <h1>MiniCraft — banc de test</h1>
    <button id="btn-menu" class="primary">Sélection ▾</button>
    <button id="btn-historique">Historique</button>
    <a id="lien-cahiers" href="/tests/cahiers" target="_blank">Cahiers</a>
    <label class="seuil">Seuil lent (s) <input id="seuil-lent" type="number" value="8" min="1" step="1"></label>

    <div id="panneau-selection" hidden>
      <div class="sel-ligne">
        <input id="recherche" placeholder="rechercher un test ou sa fiche…">
        <select id="presets"><option value="">— préréglage —</option></select>
      </div>
      <!-- SPEC-BANC-074 : périmètre d'exécution — aperçu des tests retenus et
           de leur raison AVANT tout lancement (rien ne s'exécute avant « Lancer ») -->
      <div class="sel-ligne" id="perimetre-ligne">
        <select id="perimetre-mode" aria-label="périmètre d'exécution">
          <option value="">— périmètre —</option>
          <option value="commit">Périmètre du commit</option>
          <option value="depuis">Périmètre depuis…</option>
          <option value="tout">Tout</option>
        </select>
        <input id="perimetre-ref" placeholder="référence, ex. master" value="master" hidden>
        <button id="btn-perimetre" type="button">Aperçu</button>
      </div>
      <div id="perimetre-apercu" class="perimetre-apercu" hidden></div>
      <!-- SPEC-BANC-065 : la sélection se regroupe par catégorie, domaine, spec, fonction ou étiquette -->
      <div class="sel-ligne" id="regroupement-ligne">
        <label>Regrouper par
          <select id="regrouper">
            <option value="">type › domaine › groupe</option>
            <option value="categorie">catégorie</option>
            <option value="domaine">domaine</option>
            <option value="spec">spec</option>
            <option value="fonction">fonction</option>
            <option value="etiquette">étiquette</option>
          </select>
        </label>
      </div>
      <div id="arbre" class="arbre"></div>
      <div class="sel-bar">
        <span id="compteur">0 test(s) retenu(s)</span>
        <button id="btn-tout">Tout</button>
        <button id="btn-echecs">Relancer les échecs</button>
        <button id="btn-arreter" disabled>Arrêter</button>
        <button id="btn-lancer" class="primary">Lancer</button>
      </div>
    </div>
  </header>

  <main id="corps">
    <section id="colonne-gauche">
      <ul id="liste-tests" aria-label="tests effectués"></ul>
      <div id="resume" class="resume"></div>
    </section>
    <section id="colonne-droite">
      <div id="quart-haut">
        <div id="lents" class="panneau"><h3>Tests lents</h3><ul class="items"></ul></div>
        <div id="erreurs" class="panneau"><h3>Tests en erreur</h3><ul class="items"></ul></div>
      </div>
      <div id="quart-bas">
        <!-- surface virtuelle : résolution fixe et réaliste (par défaut
             1280×800), mise à l'échelle par transform CSS pour tenir dans le
             quart — le jeu ne se croit donc jamais dans une minuscule
             fenêtre (SPEC-BANC-008/017). -->
        <div id="surface-virtuelle"><div id="host"></div></div>
        <div id="panneau-debug" class="debug"></div>
      </div>
      <div id="surface-agrandie" hidden></div>
    </section>
  </main>

  <!-- Historique global (SPEC-BANC-033 à 040, docs/banc/historique-global.md
       §3.1) : zone du banc au même titre que le rendu 3D, le rapport, les
       tests lents et la sélection — cachée par défaut, recouvre #corps quand
       ouverte (voir tests/historique.css). Logique dans tests/historique.js,
       lui-même client des routes /tests/historique/* de server.js. -->
  <div id="zone-historique" hidden>
    <div class="hist-barre">
      <h2>Historique global</h2>
      <div class="hist-rapides">
        <label><input type="checkbox" id="hist-rapide-inscrits" checked> Inscrits seulement</label>
        <button type="button" data-rapide="tous">Tous les runs</button>
        <button type="button" data-rapide="echecs">Échecs</button>
        <button type="button" data-rapide="lents">Lents</button>
      </div>
      <span class="hist-spacer"></span>
      <button type="button" id="hist-graphes-btn" aria-pressed="false" title="graphiques timeline des lignes filtrées">Graphiques</button>
      <div class="hist-colonnes">
        <button type="button" id="hist-colonnes-btn">Colonnes ▾</button>
        <div id="hist-colonnes-menu" class="hist-menu" hidden></div>
      </div>
      <button type="button" id="hist-repartition-btn">Répartition</button>
      <button type="button" id="hist-export-csv">Export CSV</button>
      <button type="button" id="hist-export-html">Export HTML</button>
      <button type="button" id="hist-fermer">Fermer ✕</button>
    </div>
    <!-- graphiques timeline (SPEC-BANC-041 à 045, §3.2) : suivent les filtres du tableau -->
    <div id="hist-graphes" hidden></div>
    <div class="hist-table-wrap">
      <table id="hist-table"><thead><tr></tr></thead><tbody></tbody></table>
    </div>
    <!-- Répartition de la vue filtrée par dimension (SPEC-BANC-064) -->
    <div id="hist-repartition" hidden></div>
    <!-- panneau « test » (SPEC-BANC-039/121) : tous les passages d'un test -->
    <div id="hist-panneau-test" hidden></div>
    <div class="hist-pagination">
      <span id="hist-page-info"></span>
      <button type="button" id="hist-page-prec">◀ précédent</button>
      <button type="button" id="hist-page-suiv">suivant ▶</button>
      <label>Taille de page
        <select id="hist-taille">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="250">250</option>
        </select>
      </label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Meme jeton anti-cache que le jeu : sans lui, la page de tests peut charger
   un melange de versions et produire des echecs inexplicables. */
var v = Date.now();
function balise(f) { return '<scr' + 'ipt src="' + f + '?v=' + v + '"></scr' + 'ipt>'; }
// harness.js d'abord (il pose G.T), puis presets.js et catalogue.js (dans cet
// ordre : catalogue.js relit G.MC_PRESETS), puis rapport.js (repli local du
// cahier de test si le serveur ne répond pas) — même ordre que tests/run.js.
document.write(['harness.js', 'presets.js', 'catalogue.js', 'rapport.js', 'fichiers-tests.js'].map(balise).join(''));
</script>
<script>
document.write(['../src/journal.js', '../src/core.js', '../src/formes.js', '../src/noise.js', '../src/biomes.js', '../src/densite.js', '../src/zones.js', '../src/volcanisme.js', '../src/caravanes.js', '../src/souterrain.js', '../src/recifs.js', '../src/donjons.js', '../src/habitats.js', '../src/routes.js', '../src/histoire.js', '../src/recits.js', '../src/recit-serveur.js', '../src/carte.js', '../src/eau.js', '../src/feu.js', '../src/meteo.js', '../src/lointain.js', '../src/world.js', '../src/circuits.js', '../src/lumiere.js', '../src/ombres.js', '../src/succes.js', '../src/mesher.js', '../src/physics.js', '../src/file-chunks.js', '../src/taches-chunks.js', '../src/faune.js', '../src/factions.js', '../src/inventory.js', '../src/conteneurs.js', '../src/vehicules.js', '../src/entities.js', '../src/metiers.js', '../src/economie.js',

  '../src/player.js', '../src/synchro.js', '../src/travaux-serveur.js', '../src/daycycle.js', '../src/save.js', '../src/saves.js', '../src/parties-fichier.js', '../src/poste.js',
  '../src/modes.js', '../src/chat.js', '../src/commandes.js', '../src/options.js', '../src/apparence.js', '../src/split.js', '../src/hud.js', '../src/gamepad.js', '../src/contrats-vague2.js', '../src/contrats-archi.js', '../src/net-protocol.js', '../src/parametres.js', '../src/admin.js', '../src/politique.js', '../src/guildes.js', '../src/pvp-enjeux.js', '../src/livre.js', '../src/livres.js', '../src/net.js', '../src/ambiance.js', '../src/audio.js', '../src/qualite.js', '../src/atlas.js', '../src/workers.js',
  '../src/render.js', '../src/ui.js', '../src/input.js', '../src/game.js', '../src/debug.js']
  .map(balise).join(''));
</script>
<script>
/* Fichiers de tests Node purs (unit/functional/spec-*) — LA MÊME liste et le
   même ordre que `node tests/run.js` : tests/fichiers-tests.js, partagé
   (SPEC-BANC-117 — deux copies à la main avaient divergé, laissant une partie
   des tests invisible dans cette page). Les fichiers marqués `node` lisent le
   disque dès leur chargement : ils ne sont pas évalués ici (leurs tests restent
   visibles comme « Node seulement », via l'historique — SPEC-BANC-118).
   `T.fichierCourant` est posé avant chacun, comme le fait tests/run.js côté
   ligne de commande : c'est ce dont tests/catalogue.js a besoin pour déduire
   le type d'un test de son fichier d'origine (SPEC-BANC-001). */
var fichiersTests = (window.MC_FICHIERS_TESTS || []).filter(function (e) { return !e.node; }).map(function (e) { return e.f; });
// sans la liste, le banc n'aurait AUCUN test Node : on le dit, en clair,
// au lieu d'afficher un catalogue silencieusement réduit aux e2e
if (!window.MC_FICHIERS_TESTS) {
  document.write('<div id="erreur-catalogue" role="alert" style="position:fixed;top:0;left:0;right:0;z-index:99;padding:10px 16px;background:#5a1d1b;color:#ffd7d4;font:13px ui-monospace,Menlo,Consolas,monospace">' +
    'tests/fichiers-tests.js n\'a pas pu être chargé : aucun test unitaire, fonctionnel ni spec n\'est disponible dans ce banc (seuls les e2e le sont). Vérifiez le serveur et rechargez la page.</div>');
  if (window.console) console.error('banc : tests/fichiers-tests.js absent — catalogue Node vide');
}

document.write(fichiersTests.map(function (f) {
  return '<scr' + 'ipt>T.fichierCourant="tests/' + f + '.js";</scr' + 'ipt>' + balise(f + '.js');
}).join('') + '<scr' + 'ipt>T.fichierCourant=null;</scr' + 'ipt>');
</script>
<script>
document.write(['e2e.js', 'jouabilite-analyse.js', 'e2e-jouabilite.js', 'e2e-banc.js', 'banc-ui.js', 'historique-vues.js', 'historique.js'].map(balise).join(''));
</script>
</body>
</html>
